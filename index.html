/* ---------- Struk ---------- */
.rc{font-family:'Courier New',Courier,monospace;font-size:12px;line-height:1.45;color:#000}
.rc-c{text-align:center}
.rc-r{display:flex;justify-content:space-between;gap:8px}

.rc-hr{border-top:1px dashed #000;margin:6px 0}
.rc-big{font-weight:700;font-size:13px}
#printArea{display:none}
@media print{
  body > *:not(#printArea){display:none!important}
  html,body{background:#fff!important;overflow:visible!important;margin:0!important;padding:0!important}
  #printArea{display:block!important;width:var(--pw,58mm);padding:2mm 3mm}
}

<style id="appStyle">
:host{all:initial;display:block}
#appRoot{
  --brand:#0D9488;--brand2:#0EA5E9;--brand3:#3B82F6;--brandD:#0F766E;
  --grad:linear-gradient(135deg,#0D9488 0%,#0EA5E9 58%,#3B82F6 100%);
  --gradText:linear-gradient(90deg,#5EEAD4 0%,#7DD3FC 55%,#A5B4FC 100%);
  --dark:linear-gradient(155deg,#0F172A 0%,#0F2B3F 100%);
  --tint:#F0FDFA;--tintB:#99F6E4;--accent:#F97316;
  --bg:#F3F6FA;--card:rgba(255,255,255,.72);--glass:rgba(255,255,255,.62);
  --ink:#0F172A;--body:#334155;--sub:#64748B;--muted:#94A3B8;
  --line:rgba(148,163,184,.3);--line2:#E2E8F0;--soft:#F1F5F9;
  --ok:#10B981;--bad:#EF4444;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px -16px rgba(15,23,42,.22);
  --shadowH:0 2px 6px rgba(15,23,42,.05),0 22px 44px -18px rgba(14,165,233,.42);
  --glow:0 12px 28px -12px rgba(14,165,233,.75);
  --r:14px;--r-lg:20px;--ease:cubic-bezier(.2,.8,.2,1);
  position:fixed;inset:0;z-index:2147483000;background:var(--bg);color:var(--body);
  font:14px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;text-align:left;
  letter-spacing:normal;word-spacing:normal;text-transform:none;text-indent:0;font-style:normal;white-space:normal;direction:ltr;
}
#appRoot::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 6% -10%,rgba(13,148,136,.16),transparent 60%),
             radial-gradient(820px 620px at 106% 108%,rgba(59,130,246,.15),transparent 60%),
             radial-gradient(620px 420px at 72% 6%,rgba(14,165,233,.09),transparent 60%)}
#appRoot *,#appRoot *::before,#appRoot *::after{box-sizing:border-box}
:where(#appRoot) h1,:where(#appRoot) h2,:where(#appRoot) h3,:where(#appRoot) p{margin:0}
:where(#appRoot) button,:where(#appRoot) input,:where(#appRoot) select,:where(#appRoot) textarea{font:inherit;color:inherit;margin:0}
:where(#appRoot) button{cursor:pointer}
:where(#appRoot) table{border-collapse:collapse;width:100%}
:where(#appRoot) img{max-width:100%}
:where(#appRoot) :focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
#appRoot [hidden]{display:none!important}
#loginView,.shell{position:relative;z-index:1;height:100%}
.rc{font-family:'Courier New',Courier,monospace;font-size:12px;line-height:1.45;color:#000}
.rc-c{text-align:center}
.rc-r{display:flex;justify-content:space-between;gap:8px}
.rc-r span:last-child{text-align:right;white-space:nowrap}
.rc-hr{border-top:1px dashed #000;margin:6px 0}
.rc-big{font-weight:700;font-size:13px}
.ico{width:18px;height:18px;flex:none}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes bump{40%{transform:scale(1.07)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes float{50%{transform:translateY(-14px)}}
.grad-text{background:var(--gradText);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Kerangka ---------- */
.shell{display:flex}
.side{width:256px;flex:none;background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
.brand img{width:40px;height:40px;border-radius:12px;flex:none;box-shadow:var(--glow)}
.brand b{display:block;color:var(--ink);font-size:15px;line-height:1.25}
.brand small{color:var(--sub);font-size:12px}
.side .pv{margin:0 8px 14px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto;border-top:1px solid var(--line);padding-top:12px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--body);padding:10px 12px;border-radius:12px;text-align:left;font-weight:500;transition:background .15s,color .15s,transform .15s}
.nav button:hover{background:rgba(13,148,136,.09);color:var(--ink);transform:translateX(2px)}
.nav button.on{background:var(--grad);color:#fff;font-weight:700;box-shadow:var(--glow);transform:none}
.side-foot{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.who{flex:1;min-width:0}
.who b{display:block;color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--sub);font-size:12px}
.icon-btn{border:0;background:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--sub);flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--soft);color:var(--bad)}
.main{flex:1;min-width:0;overflow:auto;padding:28px 32px 40px}
.main.is-pos{overflow:hidden;padding-bottom:28px}
.topbar,.bnav{display:none}
.pv{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--brandD);border:1px solid var(--tintB);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;width:max-content}
.pv .ico{width:14px;height:14px}
.enter>*{animation:rise .5s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(n+5){animation-delay:.2s}

@media (max-width:1023px){
  .side{display:none}
  .main{padding:16px 16px calc(112px + env(safe-area-inset-bottom,0px));padding-top:calc(74px + env(safe-area-inset-top,0px))}
  .main.is-pos{overflow:auto;padding-bottom:calc(176px + env(safe-area-inset-bottom,0px))}
  .topbar{display:flex;position:fixed;top:0;left:0;right:0;z-index:30;align-items:center;gap:10px;padding:10px 12px 10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid var(--line);color:var(--ink)}
  .topbar img{width:32px;height:32px;border-radius:10px}
  .topbar b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;background:rgba(255,255,255,.78);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 14px 34px -10px rgba(15,23,42,.25);padding:6px;gap:4px}
  .bnav button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;font-size:11px;font-weight:600;color:var(--sub);transition:background .2s,color .2s,transform .15s}
  .bnav button:active{transform:scale(.92)}
  .bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
}

/* ---------- Elemen umum ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.2}
.page-h .act{flex-wrap:wrap}
.muted{color:var(--sub)}
.card{background:var(--card);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);border-radius:var(--r-lg);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h2{font-size:16px;font-weight:700;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat{position:relative;overflow:hidden;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:4px;min-width:0;transition:transform .2s var(--ease),box-shadow .2s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadowH)}
.stat span{font-size:13px;color:var(--sub);font-weight:600;padding-right:44px}
.stat b{font-size:25px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.stat small{font-size:12px;color:var(--muted)}
.stat .si{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--brandD)}
.stat-hero{background:var(--grad);border-color:transparent;box-shadow:0 20px 40px -20px rgba(14,165,233,.85)}
.stat-hero::after{content:'';position:absolute;width:180px;height:180px;right:-60px;bottom:-90px;border-radius:50%;background:rgba(255,255,255,.14)}
.stat-hero span,.stat-hero small{color:rgba(255,255,255,.85)}
.stat-hero b{color:#fff}
.stat-hero .si{background:rgba(255,255,255,.2);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media(max-width:1200px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:14px}.stat b{font-size:19px}.stat .si{width:30px;height:30px;right:10px;top:10px}.stat .si .ico{width:15px;height:15px}.page-h h1{font-size:22px}}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 8px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;border-radius:0;transition:background .15s}
.row:last-child{border-bottom:0}
button.row:hover{background:rgba(13,148,136,.07);border-radius:12px}
.row .grow{flex:1;min-width:0}
.row b{color:var(--ink);font-weight:600;display:block}
.row small{color:var(--sub);font-size:12px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.strong{font-weight:700;color:var(--ink)}
.right{text-align:right}
.late{color:var(--bad)!important;font-weight:700}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:600;transition:transform .12s,background .15s,color .15s,box-shadow .2s,filter .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-navy{background:var(--ink);color:#fff}.btn-navy:hover{background:#1E293B}
.btn-amber{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.btn-amber:hover{filter:brightness(1.07) saturate(1.1);box-shadow:0 16px 34px -12px rgba(14,165,233,.85)}
.btn-ghost{background:rgba(255,255,255,.8);border-color:var(--line2);color:var(--body)}.btn-ghost:hover{background:#fff;border-color:var(--brand);color:var(--brandD)}
.btn-danger{background:#FEF2F2;color:var(--bad);border-color:#FECACA}.btn-danger:hover{background:var(--bad);color:#fff}
.btn-sm{min-height:34px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-lg{min-height:54px;font-size:16px;border-radius:14px}
.btn-block{width:100%}
.act{display:inline-flex;gap:6px;align-items:center}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.85);display:inline-grid;place-items:center;color:var(--sub);flex:none;transition:background .15s,color .15s,border-color .15s,transform .12s}
.ib:hover{background:var(--tint);color:var(--brandD);border-color:var(--tintB)}
.ib:active{transform:scale(.9)}
.ib.del:hover{background:#FEF2F2;color:var(--bad);border-color:#FECACA}
.ib.big{width:44px;height:44px;border-radius:12px}
.inp{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line2);border-radius:12px;background:rgba(255,255,255,.9);color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
.inp:hover{border-color:#CBD5E1}
.inp:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(13,148,136,.15)}
.inp:disabled{background:var(--soft);color:var(--sub)}
textarea.inp{min-height:84px;resize:vertical}
.inp-lg{font-size:20px;font-weight:700;min-height:54px;font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12.5px;font-weight:600;color:var(--sub)}
.fld .hint{font-size:12px;color:var(--muted);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.search{position:relative;flex:1;min-width:200px}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;transition:color .15s}
.search:focus-within .ico{color:var(--brand)}
.search .inp{padding-left:40px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar select.inp,.toolbar input[type=date].inp{width:auto;min-width:150px}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);background:rgba(255,255,255,.85);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--body);flex:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,border-color .15s,transform .12s}
.chip:hover{border-color:var(--brand);color:var(--brandD)}
.chip:active{transform:scale(.95)}
.chip .ico{width:15px;height:15px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip em{font-style:normal;font-size:11.5px;background:rgba(148,163,184,.2);padding:0 7px;border-radius:999px}
.chip.on em{background:rgba(255,255,255,.2)}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:rgba(226,232,240,.7);padding:5px;border-radius:14px}
.seg button{border:0;background:none;padding:10px;border-radius:10px;font-weight:600;color:var(--sub);transition:background .2s,color .2s,box-shadow .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(15,23,42,.1)}
.b{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-gray{background:#F1F5F9;color:#475569}.b-blue{background:#E0F2FE;color:#0369A1}.b-purple{background:#EDE9FE;color:#6D28D9}
.b-green{background:#D1FAE5;color:#047857}.b-slate{background:#E2E8F0;color:#334155}.b-red{background:#FEE2E2;color:#B91C1C}.b-amber{background:#FFEDD5;color:#C2410C}
.empty{text-align:center;padding:36px 16px;color:var(--sub)}
.empty .ico{width:40px;height:40px;color:var(--brand);margin:0 auto 10px;display:block;padding:9px;background:var(--tint);border-radius:14px;box-sizing:content-box}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.err{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;border-radius:12px;padding:10px 14px;font-size:13.5px;animation:pop .2s}
.note{background:var(--tint);border:1px solid var(--tintB);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:14px;white-space:pre-wrap;color:#134E4A}
.sec{font-size:14px;font-weight:700;color:var(--ink);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.dl span{display:block;font-size:12px;color:var(--sub);font-weight:600}
.dl b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}

/* ---------- Tabel ---------- */
.tbl{overflow-x:auto;border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);border-radius:var(--r-lg);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tbl th{background:rgba(241,245,249,.75);text-align:left;font-size:12.5px;font-weight:700;color:var(--sub);padding:12px 14px;white-space:nowrap}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle;transition:background .15s}
.tbl th.right,.tbl td.right{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:rgba(13,148,136,.06)}
@media(max-width:760px){
  .tbl{border:0;background:none;overflow:visible;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);border-radius:var(--r);padding:8px 14px;margin-bottom:10px}
  .tbl tbody tr.click:hover td{background:none}
  .tbl td{border:0;padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  .tbl td::before{content:attr(data-l);font-weight:600;color:var(--sub);text-align:left;font-size:12.5px;flex:none}
}

/* ---------- Kasir (POS) ---------- */

async function hashPw(pw) {
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('bajaPOS:' + pw));
    return 'sha256:' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  return 'plain:' + pw;
}
async function checkPw(pw, stored) {
  if (!stored) return false;
  if (stored.startsWith('plain:')) return stored === 'plain:' + pw;
  return stored === await hashPw(pw);
}

const DB = {
  async write(ops) {
    if (IS_PREVIEW) {
      for (const o of ops) {
        if (o.col === 'settings') { S.settings = { ...S.settings, ...clone(o.data) }; continue; }
        const arr = S[o.col];
        const i = arr.findIndex(x => x.id === o.id);
        if (o.op === 'set') { const obj = { id: o.id, ...clone(o.data) }; if (i >= 0) arr[i] = obj; else arr.unshift(obj); }
        else if (o.op === 'update') {
          if (i < 0) fail('Data tidak ditemukan. Muat ulang halaman lalu coba lagi.');
          Object.assign(arr[i], clone(o.data));
          for (const k in (o.inc || {})) arr[i][k] = num(arr[i][k]) + o.inc[k];
        }
        else if (o.op === 'delete' && i >= 0) arr.splice(i, 1);
      }
      scheduleRender();
      return;
    }
    const { fs, db } = fb;
    const batch = fs.writeBatch(db);
    for (const o of ops) {
      const ref = fs.doc(db, o.col, o.id);
      if (o.op === 'set') {
        if (o.col === 'settings') batch.set(ref, clone(o.data), { merge: true });
        else batch.set(ref, clone(o.data));
      } else if (o.op === 'update') {
        const d = clone(o.data);
        for (const k in (o.inc || {})) d[k] = fs.increment(o.inc[k]);
        batch.update(ref, d);
      } else if (o.op === 'delete') batch.delete(ref);
    }
    try { await batch.commit(); }
    catch (e) { fail(e.code === 'permission-denied' ? 'Akses ditolak oleh Security Rules Firestore.' : (e.message || 'Gagal menyimpan ke database.')); }
  }
};

async function initFirebase() {
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  const [app, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const a = app.initializeApp(firebaseConfig);
  fb = { au, fs, auth: au.getAuth(a), db: fs.getFirestore(a) };
}
function startSync() {
  stopSync();
  if (IS_PREVIEW) return;
  const { fs, db } = fb;
  for (const col of SYNC[session.role]) {
    const ref = fs.collection(db, col);
    const q = ['sales', 'payments', 'stock_logs'].includes(col) ? fs.query(ref, fs.orderBy('createdAt', 'desc'), fs.limit(3000)) : ref;
    unsubs.push(fs.onSnapshot(q, snap => {
      if (col === 'settings') { const d = snap.docs.find(x => x.id === 'toko'); S.settings = d ? d.data() : {}; }
      else S[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (view === 'settings' && col !== 'settings') return;
      scheduleRender();
    }, err => toast(`Gagal memuat data ${col}: ${err.code === 'permission-denied' ? 'akses ditolak Security Rules' : err.message}`, 'bad')));
  }
}
function stopSync() { unsubs.forEach(u => { try { u(); } catch (e) { } }); unsubs = []; }
function authMsg(e) {
  const c = e?.code || '';
  if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-email', 'auth/invalid-login-credentials'].includes(c)) return 'Email atau password salah.';
  if (c === 'auth/too-many-requests') return 'Terlalu banyak percobaan masuk. Tunggu beberapa menit lalu coba lagi.';
  if (c === 'auth/network-request-failed') return 'Tidak ada koneksi internet.';
  if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') return 'Metode login ini belum diaktifkan di Firebase Authentication.';
  if (c === 'auth/unauthorized-domain') return `Domain ${location.hostname} belum didaftarkan. Tambahkan di Firebase Authentication > Settings > Authorized domains.`;
  if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') return 'apiKey di firebaseConfig salah. Salin ulang dari Project settings.';
  if (c === 'auth/configuration-not-found') return 'Firebase Authentication belum diaktifkan di project ini.';
  if (c === 'permission-denied') return 'Akses database ditolak. Periksa Security Rules dan pastikan login Anonymous sudah aktif.';
  return e?.message || 'Gagal masuk.';
}
async function loginAdmin(email, pw) {
  if (IS_PREVIEW) {
    if (email.trim().toLowerCase() === 'admin@toko.com' && pw === 'admin123') { session = { role: 'admin', name: 'Admin Toko', id: 'admin' }; return; }
    fail('Email atau password admin salah.');
  }
  try {
    const c = await fb.au.signInWithEmailAndPassword(fb.auth, email.trim(), pw);
    session = { role: 'admin', name: c.user.email, id: c.user.uid };
    startSync();
  } catch (e) { fail(authMsg(e)); }
}
async function loginStaff(username, pw) {
  const u = username.trim().toLowerCase();
  const verify = async rec => {
    if (!rec || !(await checkPw(pw, rec.password))) fail('Username atau password salah.');
    if (rec.aktif === false) fail('Akun ini dinonaktifkan. Hubungi admin toko.');
    if (!['kasir', 'produksi'].includes(rec.role)) fail('Peran akun tidak dikenali.');
    session = { role: rec.role, name: rec.nama || rec.username, id: rec.id };
  };
  if (IS_PREVIEW) { await verify(S.users.find(x => x.username === u)); return; }
  try {
    await fb.au.signInAnonymously(fb.auth);
    const { fs, db } = fb;
    const snap = await fs.getDocs(fs.query(fs.collection(db, 'users'), fs.where('username', '==', u), fs.limit(1)));
    const d = snap.docs[0];
    await verify(d ? { id: d.id, ...d.data() } : null);
    startSync();
  } catch (e) {
    try { await fb.au.signOut(fb.auth); } catch (_) { }
    fail(e.code ? authMsg(e) : e.message);
  }
}
async function logout() {
  stopSync();
  session = null; cart = []; cartCustomer = ''; cartDiskon = 0; view = 'dashboard'; ui.cartOpen = false; ui.loginErr = '';
  closeAllModals();
  if (!IS_PREVIEW) { S = emptyState(); try { await fb.au.signOut(fb.auth); } catch (e) { } }
  $('#loginView').dataset.ready = '';
  render();
}

function openModal(html, cls = '', opts = {}) {
  const root = $('#modalRoot');
  [...root.children].forEach(c => c.style.display = 'none');
  const w = document.createElement('div');
  w.className = 'modal-back';
  if (opts.static) w.dataset.static = '1';
  w.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  if (!opts.static) w.addEventListener('mousedown', e => { if (e.target === w) closeModal(); });
  root.appendChild(w);
  icons();
  if (window.matchMedia('(min-width:1024px)').matches) {
    const f = w.querySelector('[autofocus]') || w.querySelector('.m-b input:not([type=hidden]):not([disabled]), .m-b select:not([disabled]), .m-b textarea');
    if (f) f.focus();
  }
  return w;
}

  const root = $('#modalRoot');

}

let rq = false;

function captureFocus() {

}

  try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch (_) { }
}
function render() {

}
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateCounts(root) {
  if (reduceMotion()) return;
  root.querySelectorAll('[data-count]').forEach(el => {
    const target = num(el.dataset.count), isRp = el.dataset.fmt === 'rp';
    const t0 = performance.now(), dur = 900;
    const step = now => {
      if (!el.isConnected) return;
      const p = Math.min(1, (now - t0) / dur), v = target * (1 - Math.pow(1 - p, 3));
      el.textContent = isRp ? rp(v) : Math.round(v).toLocaleString('id-ID');
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function flyToCart(fromEl) {
  if (reduceMotion() || !fromEl) return;
  const target = window.matchMedia('(max-width:1023px)').matches ? $('.cartbar') : $('.cart-h h2');
  if (!target) return;
  const a = fromEl.getBoundingClientRect(), b = target.getBoundingClientRect();
  const dot = document.createElement('div'); dot.className = 'fly';
  const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2, x1 = b.left + Math.min(b.width / 2, 60), y1 = b.top + b.height / 2;
  dot.style.left = x0 + 'px'; dot.style.top = y0 + 'px';
  $('#appRoot').appendChild(dot);
  const anim = dot.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: `translate(${(x1 - x0) * .5}px,${Math.min(y0, y1) - y0 - 90}px) scale(1.25)`, opacity: 1, offset: .45 },
    { transform: `translate(${x1 - x0}px,${y1 - y0}px) scale(.4)`, opacity: .3 }
  ], { duration: 620, easing: 'cubic-bezier(.4,0,.2,1)' });
  anim.onfinish = () => { dot.remove(); target.classList.remove('bump'); void target.offsetWidth; target.classList.add('bump'); };
}

function quickAmounts(total) {
  const out = [total];
  for (const step of [10000, 50000, 100000, 500000, 1000000]) {
    const v = Math.ceil(total / step) * step;
    if (v > total && !out.includes(v)) out.push(v);
  }
  return out.slice(0, 5);
}

function payCalc() {

    box.innerHTML = `<span>Sisa piutang</span><span class="num">${rp(total - amt)}</span>`;

async function commitSale(metode, uang, jatuhTempo, metodeDp) {
  const err = stockError(); if (err) fail(err);
  const { subtotal, diskon, total } = cartTotals();
  const dibayar = Math.min(uang, total), sisa = Math.max(0, total - dibayar);
  const kembalian = metode === 'Tempo' ? 0 : Math.max(0, uang - total);
  const id = genId(), now = nowISO(), no = nextNo('INV', 'sales', 'noNota'), cust = cartCustomer || null;
  const items = cart.map(it => ({ productId: it.productId, nama: it.nama, satuan: it.satuan, qty: num(it.qty), harga: num(it.harga), hargaBeli: num(it.hargaBeli), diskon: num(it.diskon), subtotal: lineTotal(it) }));
  const sale = { noNota: no, tanggal: now, customerId: cust, items, subtotal, diskon, total, metodeBayar: metode, dibayar, uangDiterima: uang, kembalian, sisaPiutang: sisa, jatuhTempo: metode === 'Tempo' ? jatuhTempo : null, status: sisa > 0 ? 'tempo' : 'lunas', kasir: session.name, createdAt: now };
  const ops = [{ op: 'set', col: 'sales', id, data: sale }];
  for (const it of items) {
    ops.push({ op: 'update', col: 'products', id: it.productId, data: { updatedAt: now }, inc: { stok: -it.qty } });
    ops.push(logOp(it.productId, it.nama, 'keluar', -it.qty, `Penjualan ${no}`, id));
  }
  if (dibayar > 0) ops.push(payOp('sale', id, no, cust, dibayar, metode === 'Tempo' ? (metodeDp || 'Tunai') : metode));
  if (sisa > 0) ops.push(...custInc(cust, sisa));
  await DB.write(ops);
  cart = []; cartCustomer = ''; cartDiskon = 0; ui.cartOpen = false;
  render();
  return { id, ...sale };
}

  const rows = list.map(l => {
    const p = byId('products', l.productId);
    return `<tr>${td('Waktu', fmtDT(l.createdAt))}${td('Produk', esc(p?.nama || l.namaProduk || '-'))}${td('Jenis', `<span class="b ${TIPE[l.tipe]?.[1] || 'b-gray'}">${TIPE[l.tipe]?.[0] || esc(l.tipe)}</span>`)}${td('Jumlah', `<span class="num strong" style="color:${num(l.qty) < 0 ? 'var(--bad)' : 'var(--ok)'}">${num(l.qty) > 0 ? '+' : ''}${qtyF(l.qty)}</span> <small class="muted">${esc(p?.satuan || '')}</small>`, 'right')}${td('Keterangan', esc(l.keterangan || '-'))}${td('Oleh', esc(l.oleh || '-'))}</tr>`;

/* ---------- Pelanggan & piutang ---------- */
VIEWS.customers = () => {
  const rec = receivables();
  const piutangOf = id => sum(rec.filter(r => r.customerId === id).map(r => r.sisa));
  const t = dateKey();
  const tabs = `<div class="seg" style="max-width:360px;margin-bottom:16px"><button class="${ui.custTab === 'pelanggan' ? 'on' : ''}" data-act="custTab" data-v="pelanggan">Pelanggan</button><button class="${ui.custTab === 'piutang' ? 'on' : ''}" data-act="custTab" data-v="piutang">Piutang (${rec.length})</button></div>`;
  let body;
  if (ui.custTab === 'piutang') {
    const rows = rec.map(r => `<tr class="click" data-act="${r.tipe === 'sale' ? 'saleDetail' : 'orderDetail'}" data-id="${r.id}">${td('Nomor', `<span class="strong">${esc(r.no)}</span>`)}${td('Jenis', r.label)}${td('Pelanggan', esc(custName(r.customerId)))}${td(r.tipe === 'sale' ? 'Jatuh tempo' : 'Target selesai', `<span class="${r.due && r.due < t ? 'late' : ''}">${fmtDate(r.due)}</span>`)}${td('Sisa', `<span class="num strong">${rp(r.sisa)}</span>`, 'right')}${td('Aksi', `<button class="btn btn-amber btn-sm" data-act="payRecv" data-tipe="${r.tipe}" data-id="${r.id}">Terima bayar</button>`, 'right')}</tr>`);
    body = `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><div class="stat stat-hero"><span>Total piutang berjalan</span><b>${rp(sum(rec.map(r => r.sisa)))}</b><small>${rec.length} tagihan</small></div><div class="stat"><span>Sudah lewat tanggal</span><b>${rp(sum(rec.filter(r => r.due && r.due < t).map(r => r.sisa)))}</b><small>${rec.filter(r => r.due && r.due < t).length} tagihan</small></div></div>
      ${rec.length ? tableHTML(['Nomor', 'Jenis', 'Pelanggan', 'Jatuh tempo', { t: 'Sisa' }, ''], rows) : `<div class="card">${empty('wallet', 'Tidak ada piutang', 'Semua penjualan tempo dan pesanan lemari sudah lunas.')}</div>`}`;
  } else {
    const q = ui.custSearch.trim().toLowerCase();
    const list = S.customers.filter(c => !q || `${c.nama} ${c.telepon} ${c.alamat}`.toLowerCase().includes(q)).sort((a, b) => String(a.nama).localeCompare(b.nama));
    const rows = list.map(c => { const pi = piutangOf(c.id); return `<tr class="click" data-act="custDetail" data-id="${c.id}">${td('Nama', `<span class="strong">${esc(c.nama)}</span>`)}${td('Tipe', `<span class="b b-gray">${TIPE_LABEL[c.tipe] || 'Umum'}</span>`)}${td('Telepon', esc(c.telepon || '-'))}${td('Alamat', esc(c.alamat || '-'))}${td('Piutang', pi > 0 ? `<span class="b b-amber">${rp(pi)}</span>` : '<span class="muted">-</span>', 'right')}${td('Aksi', `<span class="act"><button class="ib" data-act="custEdit" data-id="${c.id}" aria-label="Ubah">${ic('pencil')}</button>${can('admin') ? `<button class="ib del" data-act="custDel" data-id="${c.id}" aria-label="Hapus">${ic('trash-2')}</button>` : ''}</span>`, 'right')}</tr>`; });
    body = `<div class="toolbar"><div class="search">${ic('search')}<input id="custSearch" class="inp" placeholder="Cari nama, telepon, atau alamat" value="${esc(ui.custSearch)}" data-in="custSearch" autocomplete="off"></div></div>
      ${list.length ? tableHTML(['Nama', 'Tipe', 'Telepon', 'Alamat', { t: 'Piutang' }, ''], rows) : `<div class="card">${empty('users', S.customers.length ? 'Tidak ada pelanggan yang cocok' : 'Belum ada pelanggan', S.customers.length ? 'Coba kata kunci lain.' : 'Pelanggan dibutuhkan untuk pesanan lemari dan transaksi tempo.', !S.customers.length ? `<button class="btn btn-amber" data-act="custNew">${ic('user-plus')} Tambah pelanggan</button>` : '')}</div>`}`;
  }
  return `<header class="page-h"><div><h1>Pelanggan & Piutang</h1><p class="muted">${S.customers.length} pelanggan terdaftar</p></div><button class="btn btn-amber" data-act="custNew">${ic('user-plus')} Pelanggan baru</button></header>${tabs}${body}`;
};

    ${fld('Tipe', `<select class="inp" name="tipe">${Object.entries(TIPE_LABEL).map(([k, v]) => `<option value="${k}" ${(c?.tipe || 'umum') === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`)}
    ${fld('Alamat', `<textarea class="inp" name="alamat">${esc(c?.alamat || '')}</textarea>`, 'full')}
  </div></div>${mFoot(c ? 'Simpan perubahan' : 'Simpan pelanggan')}</form>`, 'small');

function custDetail(id) {
  const c = byId('customers', id); if (!c) return toast('Pelanggan tidak ditemukan.', 'bad');
  const rec = receivables().filter(r => r.customerId === id);
  const pays = S.payments.filter(p => p.customerId === id).sort(byDateDesc('tanggal')).slice(0, 8);
  const nSale = S.sales.filter(s => s.customerId === id && s.status !== 'batal').length;
  const nOrder = S.orders.filter(o => o.customerId === id).length;

  openModal(`${mHead(esc(c.nama), TIPE_LABEL[c.tipe] || 'Umum')}<div class="m-b">

    <div class="sec"><span>Piutang berjalan</span><span class="num">${rp(sum(rec.map(r => r.sisa)))}</span></div>
    <div class="rows">${rec.length ? rec.map(r => `<div class="row"><div class="grow"><b>${esc(r.no)}</b><small>${r.label}, ${r.tipe === 'sale' ? 'jatuh tempo' : 'target'} <span class="${r.due && r.due < t ? 'late' : ''}">${fmtDate(r.due)}</span></small></div><b class="num">${rp(r.sisa)}</b><button class="btn btn-amber btn-sm" data-act="payRecv" data-tipe="${r.tipe}" data-id="${r.id}" data-after="cust:${id}">Bayar</button></div>`).join('') : '<p class="muted">Tidak ada piutang.</p>'}</div>
    <div class="sec">Pembayaran terakhir</div>
    <div class="rows">${pays.length ? pays.map(p => `<div class="row"><div class="grow"><b>${esc(p.refNo)}</b><small>${fmtDT(p.tanggal)}, ${esc(p.metode)}</small></div><b class="num">${rp(p.jumlah)}</b></div>`).join('') : '<p class="muted">Belum ada pembayaran.</p>'}</div>
  </div><div class="m-f"><button class="btn btn-ghost" data-act="custEdit" data-id="${id}" data-after="cust:${id}">${ic('pencil')} Ubah data</button><button class="btn btn-navy" data-act="closeModal">Tutup</button></div>`, 'wide');
}

/* ---------- Riwayat transaksi ---------- */
VIEWS.history = () => {
  const from = ui.histFrom || firstOfMonth(), to = ui.histTo || dateKey();
  const q = ui.histSearch.trim().toLowerCase();
  const inR = iso => { const k = keyOf(iso); return k >= from && k <= to; };
  const tabs = `<div class="seg" style="max-width:360px;margin-bottom:16px"><button class="${ui.histTab === 'penjualan' ? 'on' : ''}" data-act="histTab" data-v="penjualan">Penjualan</button><button class="${ui.histTab === 'pembayaran' ? 'on' : ''}" data-act="histTab" data-v="pembayaran">Pembayaran masuk</button></div>`;
  const tools = `<div class="toolbar"><div class="search">${ic('search')}<input id="histSearch" class="inp" placeholder="Cari nomor atau pelanggan" value="${esc(ui.histSearch)}" data-in="histSearch" autocomplete="off"></div>
    <input class="inp" type="date" value="${from}" data-ch="histFrom" aria-label="Dari tanggal"><input class="inp" type="date" value="${to}" data-ch="histTo" aria-label="Sampai tanggal"></div>`;
  let body;
  if (ui.histTab === 'pembayaran') {
    const list = S.payments.filter(p => inR(p.tanggal) && (!q || `${p.refNo} ${custName(p.customerId)}`.toLowerCase().includes(q))).sort(byDateDesc('tanggal'));
    const rows = list.map(p => `<tr class="click" data-act="${p.refTipe === 'sale' ? 'saleDetail' : 'orderDetail'}" data-id="${p.refId}">${td('Waktu', fmtDT(p.tanggal))}${td('Referensi', `<span class="strong">${esc(p.refNo)}</span>`)}${td('Jenis', p.refTipe === 'sale' ? 'Penjualan' : 'Pesanan lemari')}${td('Pelanggan', esc(custName(p.customerId)))}${td('Metode', esc(p.metode))}${td('Jumlah', `<span class="num strong">${rp(p.jumlah)}</span>`, 'right')}${td('Oleh', esc(p.oleh))}</tr>`);
    body = `<p class="muted" style="margin-bottom:12px">${list.length} pembayaran, total <b class="num strong">${rp(sum(list.map(p => p.jumlah)))}</b></p>
      ${list.length ? tableHTML(['Waktu', 'Referensi', 'Jenis', 'Pelanggan', 'Metode', { t: 'Jumlah' }, 'Oleh'], rows) : `<div class="card">${empty('banknote', 'Tidak ada pembayaran', 'Ubah rentang tanggal untuk melihat data lain.')}</div>`}`;
  } else {
    const list = S.sales.filter(s => inR(s.tanggal) && (!q || `${s.noNota} ${custName(s.customerId)}`.toLowerCase().includes(q))).sort(byDateDesc('tanggal'));
    const valid = list.filter(s => s.status !== 'batal');
    const rows = list.map(s => `<tr class="click" data-act="saleDetail" data-id="${s.id}">${td('No. nota', `<span class="strong">${esc(s.noNota)}</span>`)}${td('Waktu', fmtDT(s.tanggal))}${td('Pelanggan', esc(custName(s.customerId)))}${td('Metode', esc(s.metodeBayar))}${td('Total', `<span class="num strong">${rp(s.total)}</span>`, 'right')}${td('Status', saleBadge(s))}${td('Kasir', esc(s.kasir))}</tr>`);
    body = `<p class="muted" style="margin-bottom:12px">${valid.length} transaksi, total <b class="num strong">${rp(sum(valid.map(s => s.total)))}</b>${list.length > valid.length ? `, ${list.length - valid.length} dibatalkan` : ''}</p>
      ${list.length ? tableHTML(['No. nota', 'Waktu', 'Pelanggan', 'Metode', { t: 'Total' }, 'Status', 'Kasir'], rows) : `<div class="card">${empty('receipt', 'Tidak ada transaksi', 'Ubah rentang tanggal untuk melihat data lain.')}</div>`}`;
  }
  return `<header class="page-h"><div><h1>Riwayat Transaksi</h1><p class="muted">${fmtDate(from)} sampai ${fmtDate(to)}</p></div></header>${tabs}${tools}${body}`;
};
function saleDetail(id) {
  const s = byId('sales', id); if (!s) return toast('Transaksi tidak ditemukan.', 'bad');
  const pays = S.payments.filter(p => p.refTipe === 'sale' && p.refId === id).sort(byDateDesc('tanggal'));
  const rows = (s.items || []).map(i => `<tr>${td('Produk', esc(i.nama))}${td('Jumlah', `${qtyF(i.qty)} ${esc(i.satuan)}`, 'right')}${td('Harga', `<span class="num">${rp(i.harga)}</span>`, 'right')}${td('Diskon', num(i.diskon) ? `<span class="num">-${rp(i.diskon)}</span>` : '-', 'right')}${td('Subtotal', `<span class="num strong">${rp(i.subtotal)}</span>`, 'right')}</tr>`);
  openModal(`${mHead(esc(s.noNota), fmtDT(s.tanggal))}<div class="m-b">
    <div style="margin-bottom:16px">${saleBadge(s)}</div>

    ${s.status === 'tempo' && num(s.sisaPiutang) > 0 ? `<button class="btn btn-amber" data-act="payRecv" data-tipe="sale" data-id="${id}" data-after="sale:${id}">${ic('banknote')} Terima pembayaran</button>` : ''}

async function cancelSale(id) {
  const s = byId('sales', id); if (!s || s.status === 'batal') return;
  const ok = await confirmDlg('Batalkan transaksi?', `Transaksi ${esc(s.noNota)} senilai ${rp(s.total)} akan dibatalkan. Stok barang dikembalikan dan semua pembayaran transaksi ini dihapus dari catatan kas.`, 'Batalkan transaksi');
  if (!ok) return;
  const now = nowISO();
  const ops = [{ op: 'update', col: 'sales', id, data: { status: 'batal', sisaPiutang: 0, dibatalkanOleh: session.name, dibatalkanPada: now, updatedAt: now } }];
  for (const it of s.items || []) if (byId('products', it.productId)) {
    ops.push({ op: 'update', col: 'products', id: it.productId, data: { updatedAt: now }, inc: { stok: num(it.qty) } });
    ops.push(logOp(it.productId, it.nama, 'batal', num(it.qty), `Batal ${s.noNota}`, id));
  }
  S.payments.filter(p => p.refTipe === 'sale' && p.refId === id).forEach(p => ops.push({ op: 'delete', col: 'payments', id: p.id }));
  if (num(s.sisaPiutang) > 0) ops.push(...custInc(s.customerId, -num(s.sisaPiutang)));
  try { await DB.write(ops); toast(`Transaksi ${s.noNota} dibatalkan`); closeAllModals(); saleDetail(id); } catch (e) { toast(e.message, 'bad'); }
}

/* ---------- Laporan ---------- */
function repRange() {
  const t = dateKey();
  switch (ui.repPeriod) {
    case 'hari': return [t, t];
    case '7': return [addDays(t, -6), t];
    case 'bulan': return [firstOfMonth(), t];
    case 'tahun': return [`${t.slice(0, 4)}-01-01`, t];
    default: { const a = ui.repFrom || firstOfMonth(), b = ui.repTo || t; return a <= b ? [a, b] : [b, a]; }
  }
}
VIEWS.reports = () => {
  const [from, to] = repRange();
  const inR = iso => { const k = keyOf(iso); return k >= from && k <= to; };
  const sales = S.sales.filter(s => s.status !== 'batal' && inR(s.tanggal));
  const omzet = sum(sales.map(s => s.total));
  const hpp = sales.reduce((a, s) => a + (s.items || []).reduce((b, i) => b + num(i.qty) * num(i.hargaBeli), 0), 0);
  const laba = omzet - hpp;
  const pays = S.payments.filter(p => inR(p.tanggal));
  const ordersNew = S.orders.filter(o => inR(o.createdAt));
  const rec = receivables();
  // grafik
  const span = daysBetween(from, to);
  const buckets = [];
  if (span <= 62) { for (let i = 0; i <= span; i++) { const k = addDays(from, i); buckets.push({ k, label: `${Number(k.slice(8))}/${Number(k.slice(5, 7))}`, tip: fmtDate(k), v: 0, today: k === dateKey() }); } }
  else { let d = new Date(from + 'T00:00:00'); d.setDate(1); const end = new Date(to + 'T00:00:00'); while (d <= end) { const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; buckets.push({ k, label: d.toLocaleDateString('id-ID', { month: 'short' }) + ' ' + String(d.getFullYear()).slice(2), v: 0 }); d.setMonth(d.getMonth() + 1); } }
  for (const s of sales) { const k = span <= 62 ? keyOf(s.tanggal) : keyOf(s.tanggal).slice(0, 7); const b = buckets.find(x => x.k === k); if (b) b.v += num(s.total); }
  const maxV = Math.max(1, ...buckets.map(b => b.v));
  // produk terlaris
  const agg = {};
  for (const s of sales) for (const i of s.items || []) { const k = i.productId || i.nama; agg[k] = agg[k] || { nama: i.nama, satuan: i.satuan, qty: 0, omzet: 0 }; agg[k].qty += num(i.qty); agg[k].omzet += num(i.subtotal); }
  const top = Object.values(agg).sort((a, b) => b.omzet - a.omzet).slice(0, 8);
  // piutang per pelanggan
  const pc = {};
  for (const r of rec) { pc[r.customerId || ''] = (pc[r.customerId || ''] || 0) + r.sisa; }
  const piutangList = Object.entries(pc).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const metode = {};
  for (const p of pays) metode[p.metode] = (metode[p.metode] || 0) + num(p.jumlah);
  const periods = [['hari', 'Hari ini'], ['7', '7 hari'], ['bulan', 'Bulan ini'], ['tahun', 'Tahun ini'], ['custom', 'Pilih tanggal']];
  return `<header class="page-h"><div><h1>Laporan</h1><p class="muted">${fmtDate(from)} sampai ${fmtDate(to)}</p></div></header>
  <div class="toolbar"><div class="chips">${periods.map(([k, l]) => `<button class="chip ${ui.repPeriod === k ? 'on' : ''}" data-act="repPeriod" data-v="${k}">${l}</button>`).join('')}</div>
    ${ui.repPeriod === 'custom' ? `<input class="inp" type="date" value="${from}" data-ch="repFrom" aria-label="Dari tanggal"><input class="inp" type="date" value="${to}" data-ch="repTo" aria-label="Sampai tanggal">` : ''}</div>
  <div class="stats">
    <div class="stat stat-hero"><div class="si">${ic('trending-up')}</div><span>Penjualan</span><b data-count="${omzet}" data-fmt="rp">${rp(omzet)}</b><small>${sales.length} transaksi</small></div>
    <div class="stat"><div class="si">${ic('coins')}</div><span>Laba kotor</span><b data-count="${laba}" data-fmt="rp">${rp(laba)}</b><small>Margin ${omzet ? Math.round(laba / omzet * 100) : 0}% dari penjualan barang</small></div>
    <div class="stat"><div class="si">${ic('wallet')}</div><span>Kas masuk</span><b data-count="${sum(pays.map(p => p.jumlah))}" data-fmt="rp">${rp(sum(pays.map(p => p.jumlah)))}</b><small>${pays.length} pembayaran</small></div>
    <div class="stat"><div class="si">${ic('hammer')}</div><span>Pesanan lemari baru</span><b data-count="${ordersNew.length}">${ordersNew.length}</b><small>Nilai ${rp(sum(ordersNew.map(o => o.hargaTotal)))}</small></div>
  </div>
  <section class="card" style="margin-bottom:20px"><div class="card-h"><h2>Penjualan ${span <= 62 ? 'harian' : 'bulanan'}</h2><span class="muted num">Tertinggi ${rp(maxV === 1 ? 0 : maxV)}</span></div>
    ${barsHTML(buckets)}</section>
  <div class="grid2">
    <section class="card"><div class="card-h"><h2>Produk terlaris</h2></div>
      ${top.length ? `<div class="rows">${top.map((p, i) => `<div class="row"><div class="grow"><b>${i + 1}. ${esc(p.nama)}</b><small>${qtyF(p.qty)} ${esc(p.satuan)} terjual</small></div><b class="num">${rp(p.omzet)}</b></div>`).join('')}</div>` : empty('package', 'Belum ada penjualan', 'Belum ada barang terjual di periode ini.')}</section>
    <section class="card"><div class="card-h"><h2>Rekap pesanan lemari</h2></div>
      ${donutHTML(STATUS.map(st => ({ l: st, v: S.orders.filter(o => o.statusProduksi === st).length, c: STATUS_COLOR[st] })), 'Pesanan', v => Math.round(v).toLocaleString('id-ID'))}
      <p class="muted" style="margin-top:12px;font-size:12.5px">Dihitung dari semua pesanan saat ini. Nilai pesanan aktif ${rp(sum(S.orders.filter(o => o.statusProduksi !== 'Selesai').map(o => o.hargaTotal)))}.</p></section>
    <section class="card"><div class="card-h"><h2>Kas masuk per metode</h2></div>
      ${donutHTML(Object.keys({ Tunai: 1, Transfer: 1, ...metode }).map((k, i) => ({ l: k, v: metode[k] || 0, c: ['#0D9488', '#3B82F6', '#8B5CF6', '#F97316'][i % 4] })), 'Kas masuk')}</section>
    <section class="card"><div class="card-h"><h2>Piutang per pelanggan</h2><span class="num strong">${rp(sum(rec.map(r => r.sisa)))}</span></div>
      ${piutangList.length ? `<div class="rows">${piutangList.map(([cid, v]) => `<div class="row"><div class="grow"><b>${esc(custName(cid || null))}</b><small>${rec.filter(r => (r.customerId || '') === cid).length} tagihan</small></div><b class="num">${rp(v)}</b></div>`).join('')}</div>` : empty('wallet', 'Tidak ada piutang', 'Semua tagihan sudah lunas.')}</section>
    <section class="card"><div class="card-h"><h2>Ringkasan laba</h2></div>
      <div class="rows"><div class="row"><div class="grow">Penjualan bersih</div><b class="num">${rp(omzet)}</b></div><div class="row"><div class="grow">Harga pokok barang</div><b class="num">-${rp(hpp)}</b></div><div class="row"><div class="grow"><b>Laba kotor</b></div><b class="num" style="color:${laba < 0 ? 'var(--bad)' : 'var(--ok)'}">${rp(laba)}</b></div></div>
      <p class="muted" style="margin-top:10px;font-size:12.5px">Laba dihitung dari harga beli saat transaksi. Nilai pesanan lemari tidak termasuk.</p></section>
  </div>`;
};

const ACT = {
  go: el => { view = el.dataset.v; ui.enter = true; ui.cartOpen = false; closeAllModals(); render(); $('#main').scrollTop = 0; },
  logout: async () => { if (await confirmDlg('Keluar dari aplikasi?', 'Keranjang yang belum dibayar akan dikosongkan.', 'Keluar', false)) logout(); },
  more: () => {
    const menus = MENU.filter(m => m.roles.includes(session.role)).slice(4);
    openModal(`${mHead('Menu lainnya')}<div class="m-b"><div class="rows">${menus.map(m => `<button class="row" data-act="go" data-v="${m.id}">${ic(m.icon)}<div class="grow"><b>${m.label}</b></div>${ic('chevron-right')}</button>`).join('')}</div></div>`, 'small');
  },
  closeModal: () => closeModal(),
  loginTab: el => { ui.loginTab = el.dataset.v; ui.loginErr = ''; $('#loginView').dataset.ready = ''; render(); },
  posCat: el => { ui.posCat = el.dataset.id; render(); },
  addCart: el => {
    const p = byId('products', el.dataset.id); if (!p) return;
    if (num(p.stok) <= 0) return toast(`Stok ${p.nama} habis.`, 'bad');
    const it = cart.find(x => x.productId === p.id);
    if (it) {
      if (num(it.qty) + 1 > num(p.stok)) return toast(`Stok ${p.nama} tersisa ${qtyF(p.stok)} ${p.satuan}.`, 'bad');
      it.qty = num(it.qty) + 1;
    } else cart.push({ productId: p.id, nama: p.nama, satuan: p.satuan, harga: num(p.hargaJual), hargaBeli: num(p.hargaBeli), qty: 1, diskon: 0 });
    render();
    flyToCart($(`.pcard[data-id="${p.id}"]`));
  },
  qtyStep: el => {
    const i = +el.dataset.i, it = cart[i]; if (!it) return;
    const p = byId('products', it.productId);
    const v = num(it.qty) + Number(el.dataset.d);
    if (v <= 0) cart.splice(i, 1);
    else if (p && v > num(p.stok)) return toast(`Stok ${p.nama} tersisa ${qtyF(p.stok)} ${p.satuan}.`, 'bad');
    else it.qty = Math.round(v * 100) / 100;
    render();
  },
  cartDel: el => { cart.splice(+el.dataset.i, 1); render(); },
  cartClear: async () => { if (await confirmDlg('Kosongkan keranjang?', 'Semua barang di keranjang akan dihapus.', 'Kosongkan')) { cart = []; cartDiskon = 0; render(); } },

    const used = S.products.filter(p => p.kategoriId === c.id).length;
    if (used) return toast(`Kategori ${c.nama} masih dipakai ${used} produk. Pindahkan produknya dulu.`, 'bad');
    if (!(await confirmDlg('Hapus kategori?', `Kategori ${esc(c.nama)} akan dihapus.`, 'Hapus kategori'))) return;
    try { await DB.write([{ op: 'delete', col: 'categories', id: c.id }]); toast('Kategori dihapus'); closeAllModals(); catModal(); } catch (e) { toast(e.message, 'bad'); }
  },
  stockIn: () => stockInModal(),
  stockAdj: () => stockAdjModal(),
  userNew: () => userForm(null),
  userEdit: el => userForm(el.dataset.id),
  userDel: async el => {
    const u = byId('users', el.dataset.id); if (!u) return;
    if (!(await confirmDlg('Hapus pengguna?', `Akun ${esc(u.username)} tidak akan bisa masuk lagi.`, 'Hapus akun'))) return;
    try { await DB.write([{ op: 'delete', col: 'users', id: u.id }]); toast('Pengguna dihapus'); } catch (e) { toast(e.message, 'bad'); }
  },
  repPeriod: el => { ui.repPeriod = el.dataset.v; render(); }
};

/* =========================================================
   INPUT & CHANGE
   ========================================================= */
const IN = {
  posSearch: el => { ui.posSearch = el.value; render(); },
  ordSearch: el => { ui.ordSearch = el.value; render(); },
  custSearch: el => { ui.custSearch = el.value; render(); },
  prodSearch: el => { ui.prodSearch = el.value; render(); },
  histSearch: el => { ui.histSearch = el.value; render(); },
  logSearch: el => { ui.logSearch = el.value; render(); },
  payCalc: () => payCalc()
};
const CH = {
  cartCust: el => { cartCustomer = el.value; render(); },
  cartDisc: el => { cartDiskon = Math.max(0, num(el.value)); render(); },
  qty: el => {
    const i = +el.dataset.i, it = cart[i]; if (!it) return;
    const p = byId('products', it.productId);
    let v = num(el.value);
    if (!DECIMAL_UNITS.includes(it.satuan)) v = Math.round(v);
    if (v <= 0) { cart.splice(i, 1); render(); return; }
    if (p && v > num(p.stok)) { toast(`Stok ${p.nama} tersisa ${qtyF(p.stok)} ${p.satuan}.`, 'bad'); v = num(p.stok); }
    it.qty = Math.round(v * 100) / 100; render();
  },
  disc: el => { const it = cart[+el.dataset.i]; if (!it) return; it.diskon = Math.min(Math.max(0, num(el.value)), num(it.qty) * num(it.harga)); render(); },
  prodCat: el => { ui.prodCat = el.value; render(); },
  logTipe: el => { ui.logTipe = el.value; render(); },
  histFrom: el => { ui.histFrom = el.value; render(); },
  histTo: el => { ui.histTo = el.value; render(); },
  repFrom: el => { ui.repFrom = el.value; render(); },
  repTo: el => { ui.repTo = el.value; render(); },
  stockProd: el => { const p = byId('products', el.value); const h = $('#stockNow'); if (h) h.textContent = p ? `Stok sistem saat ini: ${qtyF(p.stok)} ${p.satuan}` : 'Pilih produk untuk melihat stok saat ini.'; }
};

/* =========================================================
   FORM SUBMIT
   ========================================================= */
const FORMS = {
  async adminLogin(f) {
    ui.loginErr = '';
    loggingIn = true;
    try { await loginAdmin(f.elements.email.value, f.elements.password.value); }
    catch (e) { ui.loginErr = e.message; const box = $('#loginErr'); box.textContent = e.message; box.hidden = false; return; }
    finally { loggingIn = false; }
    view = 'dashboard'; ui.enter = true; render(); toast(`Selamat datang, ${session.name}`);
  },
  async staffLogin(f) {
    ui.loginErr = '';
    loggingIn = true;
    try { await loginStaff(f.elements.username.value, f.elements.password.value); }
    catch (e) { ui.loginErr = e.message; const box = $('#loginErr'); box.textContent = e.message; box.hidden = false; return; }
    finally { loggingIn = false; }
    view = session.role === 'produksi' ? 'orders' : 'dashboard'; ui.enter = true; render(); toast(`Selamat datang, ${session.name}`);
  },
  async checkout(f) {
    const metode = f.elements.metode.value, amt = num(f.elements.dibayar.value), total = ui.payTotal;
    if (metode !== 'Tempo' && amt < total) fail('Uang yang diterima kurang dari total tagihan.');
    if (metode === 'Tempo') {
      if (!cartCustomer) fail('Transaksi tempo butuh pelanggan terdaftar. Pilih pelanggan di keranjang.');
      if (amt >= total) fail('DP sama dengan atau melebihi total. Pakai metode Tunai atau Transfer.');
      if (!f.elements.jatuhTempo.value) fail('Isi tanggal jatuh tempo.');
    }
    const sale = await commitSale(metode, amt, f.elements.jatuhTempo.value, f.elements.metodeDp.value);
    closeAllModals();
    toast(`Transaksi ${sale.noNota} tersimpan`);
    showSaleReceipt(sale, true);
  },
  async product(f) {
    const v = V(f), id = f.dataset.id, old = id ? byId('products', id) : null;
    const kode = String(v.kode || '').trim().toUpperCase();
    if (!kode || !String(v.nama || '').trim()) fail('Kode dan nama produk wajib diisi.');
    if (S.products.some(p => String(p.kode).toUpperCase() === kode && p.id !== id)) fail(`Kode ${kode} sudah dipakai produk lain.`);
    const data = { kode, nama: v.nama.trim(), kategoriId: v.kategoriId || '', satuan: v.satuan, hargaBeli: num(v.hargaBeli), hargaJual: num(v.hargaJual), stokMin: num(v.stokMin), aktif: v.aktif === 'on', updatedAt: nowISO() };
    if (data.hargaJual <= 0) fail('Harga jual harus lebih dari 0.');
    if (old) { await DB.write([{ op: 'update', col: 'products', id, data }]); toast('Produk diperbarui'); }
    else {
      const nid = genId(), stok = Math.max(0, num(v.stok));
      const ops = [{ op: 'set', col: 'products', id: nid, data: { ...data, stok, createdAt: nowISO() } }];
      if (stok > 0) ops.push(logOp(nid, data.nama, 'masuk', stok, 'Stok awal'));
      await DB.write(ops); toast('Produk ditambahkan');
    }
    closeModal();
  },
  async category(f) {
    const v = V(f), id = f.dataset.id, nama = String(v.nama || '').trim();
    if (!nama) fail('Nama kategori wajib diisi.');
    if (S.categories.some(c => c.nama.toLowerCase() === nama.toLowerCase() && c.id !== id)) fail('Nama kategori sudah ada.');
    if (id) await DB.write([{ op: 'update', col: 'categories', id, data: { nama, updatedAt: nowISO() } }]);
    else await DB.write([{ op: 'set', col: 'categories', id: genId(), data: { nama, urutan: Math.max(0, ...S.categories.map(c => num(c.urutan))) + 1, createdAt: nowISO() } }]);
    toast('Kategori disimpan'); closeAllModals(); catModal();
  },
  async customer(f) {
    const v = V(f), id = f.dataset.id;
    if (!String(v.nama || '').trim()) fail('Nama pelanggan wajib diisi.');
    const data = { nama: v.nama.trim(), telepon: String(v.telepon || '').trim(), alamat: String(v.alamat || '').trim(), tipe: v.tipe || 'umum', updatedAt: nowISO() };
    if (id) {
      await DB.write([{ op: 'update', col: 'customers', id, data }]); toast('Data pelanggan diperbarui');
      const after = f.dataset.after;
      if (after) { closeAllModals(); reopen(after); } else closeModal();
      return;
    }
    const nid = genId();
    await DB.write([{ op: 'set', col: 'customers', id: nid, data: { ...data, totalPiutang: 0, createdAt: nowISO() } }]);
    toast('Pelanggan ditambahkan'); closeModal();
    if (f.dataset.cb === 'cart') { cartCustomer = nid; render(); }
    else if (f.dataset.cb === 'order') { const sel = ROOT.getElementById('ordCust'); if (sel) { sel.insertAdjacentHTML('beforeend', `<option value="${nid}">${esc(data.nama)}</option>`); sel.value = nid; } }
  },
  async order(f) {
    const v = V(f), id = f.dataset.id, old = id ? byId('orders', id) : null;
    const harga = num(v.hargaTotal);
    if (harga <= 0) fail('Harga total harus lebih dari 0.');
    const p = num(v.p), l = num(v.l), t = num(v.t);
    if (!(p > 0 && l > 0 && t > 0)) fail('Isi ukuran panjang, lebar, dan tinggi.');
    if (!v.targetSelesai) fail('Isi tanggal target selesai.');
    const base = { jenisLemari: v.jenisLemari.trim(), ukuran: { p, l, t }, material: v.material.trim(), finishing: String(v.finishing || '').trim(), pintu: num(v.pintu), laci: num(v.laci), catatan: String(v.catatan || '').trim(), targetSelesai: v.targetSelesai, hargaTotal: harga, updatedAt: nowISO() };
    if (old) {
      const paid = num(old.hargaTotal) - num(old.sisa), sisa = harga - paid;
      if (sisa < 0) fail(`Harga total tidak boleh di bawah jumlah yang sudah dibayar (${rp(paid)}).`);
      const ops = [{ op: 'update', col: 'orders', id, data: { ...base, sisa, statusBayar: payStatus(sisa, paid) } }];
      ops.push(...custInc(old.customerId, sisa - num(old.sisa)));
      await DB.write(ops); toast('Pesanan diperbarui'); closeAllModals(); orderDetail(id); return;
    }
    if (!v.customerId) fail('Pilih pelanggan untuk pesanan ini.');
    const dp = num(v.dp);
    if (dp < 0 || dp > harga) fail('DP tidak boleh melebihi harga total.');
    const nid = genId(), now = nowISO(), no = nextNo('ORD', 'orders', 'noOrder'), sisa = harga - dp;
    const ops = [{ op: 'set', col: 'orders', id: nid, data: { ...base, noOrder: no, customerId: v.customerId, dp, sisa, statusProduksi: 'Antrian', statusBayar: payStatus(sisa, dp), riwayatStatus: [{ status: 'Antrian', waktu: now, oleh: session.name }], kasir: session.name, createdAt: now } }];
    if (dp > 0) ops.push(payOp('order', nid, no, v.customerId, dp, v.metodeDp || 'Tunai'));
    if (sisa > 0) ops.push(...custInc(v.customerId, sisa));
    await DB.write(ops); toast(`Pesanan ${no} tersimpan`); closeAllModals(); orderDetail(nid);
  },
  async receive(f) {
    const v = V(f), tipe = f.dataset.tipe, id = f.dataset.id;
    const r = tipe === 'sale' ? byId('sales', id) : byId('orders', id);
    if (!r) fail('Data tidak ditemukan.');
    const sisa = num(tipe === 'sale' ? r.sisaPiutang : r.sisa), j = num(v.jumlah);
    if (j <= 0) fail('Jumlah harus lebih dari 0.');
    if (j > sisa) fail(`Jumlah melebihi sisa tagihan (${rp(sisa)}).`);
    const ns = sisa - j, now = nowISO();
    const ops = tipe === 'sale'
      ? [{ op: 'update', col: 'sales', id, data: { sisaPiutang: ns, dibayar: num(r.dibayar) + j, status: ns <= 0 ? 'lunas' : 'tempo', updatedAt: now } }]
      : [{ op: 'update', col: 'orders', id, data: { sisa: ns, statusBayar: payStatus(ns, num(r.hargaTotal) - ns), updatedAt: now } }];
    ops.push(payOp(tipe, id, tipe === 'sale' ? r.noNota : r.noOrder, r.customerId, j, v.metode));
    ops.push(...custInc(r.customerId, -j));
    await DB.write(ops);
    toast(`Pembayaran ${rp(j)} tersimpan`);
    const after = f.dataset.after; closeAllModals(); reopen(after);
  },
  async stockIn(f) {
    const v = V(f), p = byId('products', v.productId);
    if (!p) fail('Pilih produk.');
    const q = num(v.qty); if (q <= 0) fail('Jumlah masuk harus lebih dari 0.');
    const hb = num(v.hargaBeli);
    const ket = [String(v.supplier || '').trim() ? `Dari ${v.supplier.trim()}` : '', String(v.keterangan || '').trim()].filter(Boolean).join('. ') || 'Stok masuk';
    const data = { updatedAt: nowISO() }; if (hb > 0) data.hargaBeli = hb;
    await DB.write([{ op: 'update', col: 'products', id: p.id, data, inc: { stok: q } }, logOp(p.id, p.nama, 'masuk', q, ket)]);
    toast(`Stok ${p.nama} bertambah ${qtyF(q)} ${p.satuan}`); closeModal();
  },
  async stockAdj(f) {
    const v = V(f), p = byId('products', v.productId);
    if (!p) fail('Pilih produk.');
    if (v.fisik === '' || v.fisik == null) fail('Isi stok fisik sebenarnya.');
    const fisik = num(v.fisik); if (fisik < 0) fail('Stok fisik tidak boleh minus.');
    const diff = Math.round((fisik - num(p.stok)) * 100) / 100;
    if (diff === 0) fail('Stok fisik sama dengan stok sistem. Tidak ada yang perlu dikoreksi.');
    const ket = `${v.alasan}${String(v.keterangan || '').trim() ? ': ' + v.keterangan.trim() : ''}`;
    await DB.write([{ op: 'update', col: 'products', id: p.id, data: { updatedAt: nowISO() }, inc: { stok: diff } }, logOp(p.id, p.nama, 'koreksi', diff, ket)]);
    toast(`Stok ${p.nama} dikoreksi ${diff > 0 ? '+' : ''}${qtyF(diff)}`); closeModal();
  },
  async user(f) {
    const v = V(f), id = f.dataset.id;
    const username = String(v.username || '').trim().toLowerCase();
    if (!/^[a-z0-9._-]{3,30}$/.test(username)) fail('Username 3 sampai 30 karakter: huruf kecil, angka, titik, minus, atau garis bawah.');
    if (S.users.some(u => u.username === username && u.id !== id)) fail('Username sudah dipakai.');
    const pw = String(v.password || '');
    if ((!id || pw) && pw.length < 6) fail('Password minimal 6 karakter.');
    const data = { username, nama: String(v.nama || '').trim() || username, role: v.role, aktif: v.aktif === 'on', updatedAt: nowISO() };
    if (pw) data.password = await hashPw(pw);
    if (id) await DB.write([{ op: 'update', col: 'users', id, data }]);
    else await DB.write([{ op: 'set', col: 'users', id: genId(), data: { ...data, createdAt: nowISO() } }]);
    toast(id ? 'Pengguna diperbarui' : 'Pengguna ditambahkan'); closeModal();
  },
  async settings(f) {
    const v = V(f);
    if (!String(v.nama || '').trim()) fail('Nama toko wajib diisi.');
    await DB.write([{ op: 'set', col: 'settings', id: 'toko', data: { nama: v.nama.trim(), alamat: String(v.alamat || '').trim(), telepon: String(v.telepon || '').trim(), ukuranKertas: v.ukuranKertas, footerStruk: String(v.footerStruk || '').trim(), updatedAt: nowISO() } }]);
    toast('Pengaturan disimpan'); render();
  }
};

/* =========================================================
   EVENT, PWA, INIT
   ========================================================= */
function submitForm(f) {
  if (!f || !f.dataset.form) return;
  if (typeof f.reportValidity === 'function' && !f.reportValidity()) return;
  const fn = FORMS[f.dataset.form]; if (!fn) return;
  withBusy(f.querySelector('[type=submit]'), () => fn(f));
}
function bindEvents() {
  ROOT.addEventListener('click', e => {
    // Tombol simpan/masuk dijalankan langsung: di iframe tersandbox atau sebagian widget,
    // browser memblokir pengiriman form sehingga event "submit" tidak pernah terjadi.
    const sb = e.target.closest('button[type=submit]');
    if (sb && sb.form && sb.form.dataset.form && $('#appRoot').contains(sb)) {
      e.preventDefault();
      submitForm(sb.form);
      return;
    }
    const el = e.target.closest('[data-act]');
    if (!el || !$('#appRoot').contains(el)) return;
    const fn = ACT[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  // Tooltip grafik: hover di desktop, ketuk di layar sentuh
  const tip = $('#tip'); let tipT = 0;
  const showTip = (el, x, y) => { tip.textContent = el.dataset.tip; tip.style.left = Math.max(70, Math.min(innerWidth - 70, x)) + 'px'; tip.style.top = Math.max(40, y) + 'px'; tip.classList.add('on'); };
  ROOT.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && $('#appRoot').contains(el)) showTip(el, e.clientX, e.clientY); else tip.classList.remove('on');
  });
  ROOT.addEventListener('pointerdown', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el || e.pointerType !== 'touch') return;
    showTip(el, e.clientX, e.clientY);
    clearTimeout(tipT); tipT = setTimeout(() => tip.classList.remove('on'), 1800);
  });
  ROOT.addEventListener('scroll', () => tip.classList.remove('on'), true);
  ROOT.addEventListener('input', e => { const el = e.target.closest?.('[data-in]'); if (el) IN[el.dataset.in]?.(el, e); });
  ROOT.addEventListener('change', e => { const el = e.target.closest?.('[data-ch]'); if (el) CH[el.dataset.ch]?.(el, e); });
  ROOT.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    submitForm(f);
  });
  ROOT.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) {
      const t = e.target;
      if (t && t.tagName === 'INPUT' && !['checkbox', 'radio', 'button', 'submit'].includes(t.type) && t.form && t.form.dataset.form) {
        e.preventDefault();
        submitForm(t.form);
      }
      return;
    }
    if (e.key !== 'Escape') return;
    const top = $('#modalRoot').lastElementChild;
    if (top && !top.dataset.static) closeModal();
    else if (ui.cartOpen) { ui.cartOpen = false; render(); }
  });
}
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const code = `const C='pos-baja-v1';
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  const u=new URL(e.request.url);
  if(u.hostname.includes('firestore.googleapis.com')||u.hostname.includes('identitytoolkit')||u.hostname.includes('securetoken'))return;
  e.respondWith(fetch(e.request).then(r=>{if(r&&r.ok&&(u.origin===self.location.origin||u.hostname.includes('gstatic')||u.hostname.includes('jsdelivr')||u.hostname.includes('fonts.')))
  {const cp=r.clone();caches.open(C).then(c=>c.put(e.request,cp));}return r;}).catch(()=>caches.match(e.request)));
});`;
    const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    navigator.serviceWorker.register(url).catch(() => { });
  } catch (e) { }
}
async function init() {
  const appEl = document.getElementById('appRoot');
  const styleEl = document.getElementById('appStyle');
  document.body.appendChild(document.getElementById('printArea'));
  const host = document.createElement('div');
  host.id = 'posBajaHost';
  host.setAttribute('style', 'position:fixed;inset:0;z-index:2147483000;display:block');
  document.body.appendChild(host);
  if (host.attachShadow) {
    ROOT = host.attachShadow({ mode: 'open' });
    ROOT.append(styleEl, appEl);
  } else {
    host.append(appEl);
  }
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  bindEvents();
  registerSW();
  if (IS_PREVIEW) { seedPreview(); render(); return; }
  render();
  try { await initFirebase(); }
  catch (e) {
    authReady = true; ui.loginErr = 'Gagal memuat Firebase. Periksa koneksi internet dan isi firebaseConfig.';
    $('#loginView').dataset.ready = ''; render(); return;
  }
  fb.au.onAuthStateChanged(fb.auth, async user => {
    const first = !authReady;
    authReady = true;
    if (loggingIn) return;
    if (user && !user.isAnonymous && !session) { session = { role: 'admin', name: user.email, id: user.uid }; startSync(); }
    else if (user && user.isAnonymous && !session) { try { await fb.au.signOut(fb.auth); } catch (e) { } }
    else if (!user && session) { stopSync(); session = null; S = emptyState(); closeAllModals(); }
    if (first || !session) $('#loginView').dataset.ready = '';
    render();
  });
}
init();
